name: sanitization

# The commons gate. Runs on every PR. Scans ONLY the diff (fast, never
# flaky-blocks a contributor on unrelated pre-existing content) — the full-tree
# audit belongs in a scheduled/gardener lane, not per-PR.
#
# WHAT ACTUALLY RUNS, honestly:
#
#   * The deterministic layer (secrets/PII) runs on EVERY PR, including PRs from
#     forks. It needs no credentials and hard-fails on any hit.
#
#   * The semantic layer (venture particulars) needs ANTHROPIC_API_KEY. GitHub
#     does NOT expose repository secrets to `pull_request` runs originating from
#     a fork, so on fork PRs that layer cannot run at all. Those runs are
#     labelled DETERMINISTIC-ONLY below and must be treated as partial: a green
#     check means "no secrets found", NOT "no particulars found".
#
#   * On same-repo (trusted-branch) PRs the key IS available, so the gate runs
#     with --require-semantic and fails CLOSED if the key is ever missing or
#     unset, rather than silently degrading to deterministic-only.
#
# SECURITY NOTE — accepting external contributions:
#   Making the semantic layer run on fork PRs requires switching the trigger to
#   `pull_request_target`, which runs the workflow with repository secrets in a
#   context where the PR's own code must NOT be trusted. Done carelessly — e.g.
#   checking out the PR head and then executing anything from it — that hands
#   ANTHROPIC_API_KEY to arbitrary attacker-supplied code. That is a deliberate
#   maintainer decision, not a default, and it is intentionally NOT enabled here.
#   Until it is decided, fork PRs get deterministic-only coverage and a
#   maintainer must review particulars by hand before merging.

#   * A RELEASE is the one moment the diff-scoped PR gate cannot cover, because
#     what ships is the whole tree, not a diff. v0.1.0 (published 2026-07-21) was
#     tagged one commit BEFORE the pass that added its own LICENSE; the problem
#     was found and the tag re-pointed on 2026-07-31. Every check had been green,
#     and none of them had ever looked at the tree being released.
#
#     `release-audit` below closes that, with one honest limitation:
#
#       - workflow_dispatch is the GATE. Run it green against the release
#         candidate BEFORE creating the tag. This is the run that decides.
#       - the v* tag trigger is an ALARM, not a gate. By the time a tag push
#         starts a job, the tag already exists and is already public — and
#         Swarm Map's registry pins by tag NAME, so installs resolve to that tree
#         the instant it lands. A red X ninety seconds later cannot un-publish it.
#
#     Making the tag genuinely un-cuttable means creating it from inside a green
#     workflow run (needs `contents: write`). That is the right next step and is
#     deliberately not bolted on here.

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # The full suite. Referenced as the `tests` check in CONTRIBUTING.md and
    # docs/onboarding.md, so it has to actually exist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: LICENSE must reach every INSTALLED subdirectory
        # Swarm Map installs `hermes-skill/` and `hermes-plugin/` as whole trees
        # (artifacts-sync does a recursive copy), so a root-only LICENSE leaves
        # them unlicensed in place. Found 2026-07-31.
        #
        # `docker/` is deliberately NOT in this list. It is the registry's `soul`
        # source, and that path extracts exactly one file — SOUL.template.md,
        # renamed SOUL.md — then discards the rest of the clone. No licence can
        # travel with it by that mechanism, so a docker/LICENSE would be cargo.
        #
        # This lives in `tests` (unconditional) rather than in the release job,
        # so a PR that deletes one of these fails immediately instead of at tag
        # time — which is after the point of no return.
        run: |
          missing=0
          for d in hermes-skill hermes-plugin; do
            if [ ! -f "$d/LICENSE" ]; then echo "::error::$d/LICENSE is missing"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "LICENSE present in both installed subdirectories."

  release-audit:
    # What the PR gate structurally cannot do: scan the WHOLE TREE that is about
    # to ship, with the semantic layer mandatory. Never diff-scoped — a release
    # is not a diff. See the header for why dispatch is the gate and the tag
    # trigger is only an alarm.
    #
    # --require-semantic exits non-zero when ANTHROPIC_API_KEY is absent, so a
    # misconfigured secret fails the audit instead of quietly degrading to a
    # deterministic-only pass that looks identical when green.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (semantic layer + self-tests)
        run: pip install anthropic pytest

      - name: Scanner self-tests
        run: python -m pytest tests/test_check_sanitization.py -q

      - name: Full-tree audit of the release ref (fails closed)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/check_sanitization.py --full-tree --require-semantic


  sanitize:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (semantic layer + self-tests)
        run: pip install anthropic pytest

      - name: Scanner self-tests (deterministic, no key needed)
        run: python -m pytest tests/test_check_sanitization.py -q

      - name: Resolve the diff against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git diff --name-only "origin/${BASE_REF}...HEAD" > changed.txt
          echo "changed files:"
          cat changed.txt

      # Trusted branch: the repo secret is available, so demand the semantic
      # layer. --require-semantic makes a missing key exit 2 instead of passing.
      - name: Sanitization gate (both layers, fails closed)
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          xargs -r -d '\n' python scripts/check_sanitization.py --require-semantic < changed.txt

      # Fork PR: no secret is available to this run by design. Deterministic
      # layer only — and say so loudly so a green check is not misread.
      - name: Sanitization gate (DETERMINISTIC ONLY — fork PR, no secret available)
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          set -euo pipefail
          xargs -r -d '\n' python scripts/check_sanitization.py < changed.txt
          echo "::warning title=Partial sanitization coverage::This PR is from a fork, so ANTHROPIC_API_KEY is not available and the SEMANTIC layer did not run. Secrets and PII were checked; venture particulars were NOT. A maintainer must review this diff for particulars by hand before merging."
