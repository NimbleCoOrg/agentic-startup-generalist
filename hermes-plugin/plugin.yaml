# plugin.yaml — Hermes plugin manifest for agentic-startup-generalist
#
# This file is read by the Hermes plugin loader before __init__.py is
# imported. It is the contract Swarm Map installs against.
#
# Register the plugin by adding a symlink (instance-setup.sh does this for you):
#   ~/.hermes-{agent-name}/plugins/agentic_startup_generalist -> /path/to/agentic-startup-generalist/hermes-plugin/
# Then restart the agent (or run `hermes plugin reload` if supported).
#
# The symlink name MUST be underscored: hermes-agent-mt imports data-dir
# plugins as `hermes_plugins.<dirname>`, so a dashed directory name is not a
# valid Python identifier and gets silently skipped by discovery.

# REQUIRED — short slug identifying this plugin. Unique across all plugins
# loaded by the agent. Matches the package directory name.
name: "agentic-startup-generalist"

# REQUIRED — semantic version. Bump minor when adding tools; patch for fixes;
# major for breaking changes to existing tool schemas.
version: "0.1.0"

# REQUIRED — one-sentence summary shown in `hermes plugin list`.
description: "Agentic startup generalist — lets the agent run a venture's general work: research, PMF evidence, positioning, ops/PM cadence, and founder support."

# OPTIONAL — who maintains this plugin.
author: "NimbleCo"

# OPTIONAL — deployment model. "standalone" = runs as a library in the agent
# process. "sidecar" = talks to a separate process over a local socket/HTTP.
kind: standalone

# OPTIONAL — environment variables required for this plugin's tools to work.
# The loader WARNS (does not fail) at startup if any are missing; the
# _check_available() gate in tools.py is responsible for the hard fail at
# invocation time.
#
# Deliberately empty at v0.1.0. The methodology and PMF skills need no
# credentials — they degrade to working against material a human provides,
# rather than blocking. Board/PM and repository keys get declared here when the
# tools that need them land, and NOT before: an unnecessary requires_env entry
# is a startup warning that teaches operators to ignore startup warnings.
#
# When adding: name only the genuinely required. Secrets are injected by Swarm Map
# from its encrypted env store at runtime, never committed here.
requires_env: []

# OPTIONAL — explicit list of tool names this plugin registers. Used by toolset
# management and conflict detection. Must match the tool_name values in
# __init__.py's _TOOLS tuple EXACTLY.
#
# Keep in sync with _TOOLS as tools are added or removed. The duty areas this
# package serves are deliberately not frozen yet — the tool surface is derived
# from observed real usage, not guessed up front.
provides_tools:
  - "sg_fetch_transcript"
  - "sg_route_tasks"
  - "sg_assess_pmf"
  - "sg_read_retention"
  - "sg_check_experiment"
  - "sg_draft_positioning"
  - "sg_frame_decision"
